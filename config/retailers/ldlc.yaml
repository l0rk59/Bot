# LDLC : voir docs/sites/ldlc.md (CGU lues, robots.txt respecté).
#
# La page 1 de chaque catégorie contient ses 48 produits et leurs prix (JSON-LD ItemList) :
# une seule requête donne 48 prix. Les pages suivantes chargent leurs prix en JavaScript
# depuis /stock-price/, que robots.txt interdit aux robots : on ne lit donc que la page 1.
# Pour couvrir plus de produits, on ajoute des catégories plutôt que des pages.
id: ldlc
name: LDLC
base_url: https://www.ldlc.com
enabled: true
country: FR
currency: EUR

# Au plus une requête toutes les 5 secondes : 32 catégories ≈ 3 minutes par passage.
min_interval_seconds: 5

# Vendeur « maison » : les autres vendeurs sont signalés comme vendeurs tiers.
own_seller_names: ["LDLC"]

