name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installer les dépendances
        run: uv sync --locked
      - name: Style (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest
